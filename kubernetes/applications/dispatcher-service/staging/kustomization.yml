apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/kkamdung/dispatcher-service/k8s?ref=main

patches:
  - path: patch-env.yml

configMapGenerator:
  - name: dispatcher-config
    behavior: merge
    files:
      - application-staging.yml

images:
  - name: dispatcher-service
    newName: ghcr.io/kkamdung/dispatcher-service
    newTag: latest

replicas:
  - name: dispatcher-service
    count: 1
